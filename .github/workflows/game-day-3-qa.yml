name: Game-Day 3 full QA

on:
  push:
    branches: [game-day-3-overhaul]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax sweep
        run: |
          for f in *.js; do echo "checking $f"; node --check "$f"; done
      - name: Existing game-state smoke tests
        run: node qa-smoke.js
      - name: Durability and backup tests
        run: node qa-durability.js
      - name: Settings and carry-forward tests
        run: node qa-settings.js
      - name: Relational analytics tests
        run: node qa-analytics-relations.js
      - name: Booth Workflow tests
        run: node qa-booth-workflow.js
      - name: Game IQ search tests
        run: node qa-game-iq-search.js
      - name: Setup QB and faceted filter tests
        run: node qa-qb-facets.js
      - name: Coach language tests
        run: node qa-coach-language.js
      - name: Legacy game-day regression tests
        run: node qa-game-day-fixes.js
      - name: Game IQ 2 intelligence tests
        run: node qa-game-iq-pro.js
      - name: Game IQ 2 destructive chains
        run: node qa-game-iq-pro-destructive.js
      - name: First-down and Saved Views tests
        run: node qa-game-iq-polish.js
      - name: Legacy Game IQ stability stress
        run: node qa-game-iq-stability.js
      - name: Second destructive beta simulation
        run: node qa-destructive-beta.js
      - name: Game-Day 3 speed and state tests
        run: node qa-game-day-3.js
      - name: Game IQ 3 canonical filter and stress tests
        run: node qa-game-iq-v3.js
      - name: Release and data-safety checks
        run: |
          grep -q "fniq_prod_v1" state.js
          grep -q "fniq_recovery_v1" durability.js
          grep -q "game-day-3.js" app.js
          grep -q "game-iq-v3.js" app.js
          grep -q "v=safety16" app.js
          grep -q "app.js?v=safety16" index.html
          grep -q "officialNext" game-engine.js
          grep -q "if(added&&!A.__gameDay3)" game-day-fixes.js
          grep -q "Where is the ball now?" game-day-3.js
          grep -q "Pick Six / INT returned for TD" game-day-3.js
          grep -q "OFFICIAL NEXT SNAP" game-day-3.js
          grep -q "One-glance game stats" game-iq-v3.js
          grep -q "A.getIQFilters" game-iq-v3.js
          grep -q "A.setIQFilters" game-iq-v3.js
          grep -q "1st & 10" game-iq-v3.js
          ! grep -q "MutationObserver" game-day-3.js
          ! grep -q "MutationObserver" game-iq-v3.js
          ! grep -q "2nd: 70%" index.html
          ! grep -q "15+ net yards or tagged" analytics.js
          grep -q "C.makePayload(A.state,'safety16')" durability.js
      - name: Static DOM references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          ids=set(re.findall(r'id="([^"]+)"',html))
          refs=set()
          for f in ['ui.js','analytics.js','export.js']:
              s=Path(f).read_text()
              refs.update(re.findall(r"\$\('([^']+)'\)",s))
              refs.update(re.findall(r'\$\("([^"]+)"\)',s))
          missing=sorted(refs-ids)
          dup=[x for x in ids if len(re.findall(r'id="'+re.escape(x)+r'"',html))>1]
          if missing or dup:
              raise SystemExit(f'missing={missing} duplicate_ids={dup}')
          print('Static DOM references clean')
          PY
      - name: Code size report
        run: |
          wc -l *.js *.css index.html | tail -1
