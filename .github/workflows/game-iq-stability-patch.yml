name: Game IQ stability patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Game IQ stability patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited patch
        run: python tools/stability_patch.py
      - name: Syntax and focused QA before commit
        run: |
          node --check game-iq-search.js
          node --check game-iq-facets.js
          node --check game-iq-pro.js
          node --check game-iq-polish.js
          node --check app.js
          node qa-game-iq-polish.js
          node qa-game-iq-stability.js
          node qa-game-iq-search.js
          node qa-game-iq-pro.js
          node qa-game-iq-pro-destructive.js
          node qa-destructive-beta.js
      - name: Commit stability release
        run: |
          git config user.name "Friday Night IQ QA"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Integrate native first-down filters and remove Game IQ render loop"
          git push origin HEAD:main
