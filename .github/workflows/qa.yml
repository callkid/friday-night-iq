name: Friday Night IQ QA

on:
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check game-engine.js
          node --check state.js
          node --check ui.js
          node --check durability.js
          node --check settings-ui.js
          node --check game-customization.js
          node --check booth-workflow.js
          node --check booth-fixes.js
          node --check analytics.js
          node --check analytics-relations.js
          node --check game-iq-search.js
          node --check export.js
          node --check export-extensions.js
          node --check app.js
          node --check qa-durability.js
          node --check qa-settings.js
          node --check qa-analytics-relations.js
          node --check qa-booth-workflow.js
          node --check qa-game-iq-search.js
          node --check qa-destructive-beta.js
      - name: Game-state smoke tests
        run: node qa-smoke.js
      - name: Durability and backup tests
        run: node qa-durability.js
      - name: Settings and carry-forward tests
        run: node qa-settings.js
      - name: Relational analytics tests
        run: node qa-analytics-relations.js
      - name: Booth Workflow 2.0 tests
        run: node qa-booth-workflow.js
      - name: Game IQ search tests
        run: node qa-game-iq-search.js
      - name: Game-day workflow source checks
        run: |
          grep -q "'Offside':{team:'Defense'" game-customization.js
          grep -q "First down by penalty" game-engine.js
          grep -q "Fumble Lost" game-engine.js
          grep -q "Where does this drive start?" game-customization.js
          grep -q "Set the new drive starting yard line first" game-customization.js
          ! grep -q "setTimeout(openDriveStart,80)" game-customization.js
          grep -q "Next offensive drive needs a starting spot" booth-workflow.js
          grep -q "scrollIntoView" booth-workflow.js
          grep -q "3200" booth-workflow.js
          grep -q "Doubles Right" booth-workflow.js
          grep -q "H-Jet" booth-workflow.js
          grep -q "Concept family" booth-workflow.js
          grep -q "Inside Zone" booth-workflow.js
          grep -q "Special Teams" booth-workflow.js
          grep -q "scoreMini" booth-workflow.js
          grep -q "choice.na.on" booth-workflow.css
          grep -q "Front + Coverage by Down & Distance" game-iq-search.js
          grep -q "Front + Coverage by Formation" game-iq-search.js
          grep -q "3rd short left hash blitz pass" game-iq-search.js
      - name: Release loader check
        run: |
          grep -q "durability.js" app.js
          grep -q "settings-ui.js" app.js
          grep -q "booth-workflow.js" app.js
          grep -q "booth-fixes.js" app.js
          grep -q "analytics-relations.js" app.js
          grep -q "game-iq-search.js" app.js
          grep -q "export-extensions.js" app.js
          grep -q "v=safety7" app.js
          test -f booth-workflow.css
          test -f game-iq-search.css
          grep -q "Backups & Recovery" durability.js
          grep -q "Your game is safe" durability.js
      - name: DOM reference check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          ids=set(re.findall(r'id="([^"]+)"',html))
          refs=set()
          for f in ['ui.js','analytics.js','export.js']:
              s=Path(f).read_text()
              refs.update(re.findall(r"\$\('([^']+)'\)",s))
              refs.update(re.findall(r'\$\("([^"]+)"\)',s))
          missing=sorted(refs-ids)
          dup=[x for x in ids if len(re.findall(r'id="'+re.escape(x)+r'"',html))>1]
          if missing or dup:
              raise SystemExit(f'missing={missing} duplicate_ids={dup}')
          print('Static DOM references clean')
          PY
      - name: Second destructive beta simulation
        run: node qa-destructive-beta.js
