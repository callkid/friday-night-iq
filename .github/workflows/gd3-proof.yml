name: Game-Day 3 QA proof

on:
  push:
    branches: [game-day-3-overhaul]

permissions:
  contents: write

jobs:
  proof:
    if: github.event.head_commit.message == 'Install Game-Day 3 QA proof workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run auditable full QA
        id: qa
        continue-on-error: true
        run: bash tools/run_gd3_qa.sh
      - name: Publish QA proof to branch
        if: always()
        run: |
          printf '\nSOURCE_COMMIT=%s\n' "$GITHUB_SHA" >> qa-gd3-proof.txt
          git config user.name "Friday Night IQ QA"
          git config user.email "actions@users.noreply.github.com"
          git add qa-gd3-proof.txt
          git commit -m "Record Game-Day 3 QA proof"
          git push origin HEAD:game-day-3-overhaul
      - name: Fail workflow if QA failed
        if: steps.qa.outcome != 'success'
        run: exit 1
