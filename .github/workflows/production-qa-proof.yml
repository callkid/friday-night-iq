name: Production QA proof

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  proof:
    if: github.event.head_commit.message == 'Trigger production QA proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run full quality24 source QA
        id: source
        continue-on-error: true
        run: bash tools/run_safety18_qa.sh
      - name: Run browser box, quality24, pick-six, and responsive QA
        id: browser
        continue-on-error: true
        run: |
          set +e
          echo "=== REAL BROWSER QUALITY24 QA ===" >> qa-quality24-proof.txt
          npm init -y >> qa-quality24-proof.txt 2>&1
          npm install playwright@1.55.0 >> qa-quality24-proof.txt 2>&1
          npx playwright install --with-deps chromium >> qa-quality24-proof.txt 2>&1
          python3 -m http.server 8000 --bind 127.0.0.1 >> /tmp/fniq-server.log 2>&1 &
          sleep 2
          FAIL=0
          for i in 1 2 3; do
            echo "--- Browser box pass $i ---" >> qa-quality24-proof.txt
            node qa-browser-e2e.js >> qa-quality24-proof.txt 2>&1
            CODE=$?
            if [ $CODE -ne 0 ]; then FAIL=1; echo "FAIL: Browser box pass $i" >> qa-quality24-proof.txt; else echo "PASS: Browser box pass $i" >> qa-quality24-proof.txt; fi
          done
          for i in 1 2 3; do
            echo "--- Quality24 browser pass $i ---" >> qa-quality24-proof.txt
            node qa-browser-quality24.js >> qa-quality24-proof.txt 2>&1
            CODE=$?
            if [ $CODE -ne 0 ]; then FAIL=1; echo "FAIL: Quality24 browser pass $i" >> qa-quality24-proof.txt; else echo "PASS: Quality24 browser pass $i" >> qa-quality24-proof.txt; fi
          done
          echo "--- Pick-six browser path ---" >> qa-quality24-proof.txt
          node qa-browser-pick-six.js >> qa-quality24-proof.txt 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then FAIL=1; echo "FAIL: Pick-six browser path" >> qa-quality24-proof.txt; else echo "PASS: Pick-six browser path" >> qa-quality24-proof.txt; fi
          echo "--- Responsive viewport matrix ---" >> qa-quality24-proof.txt
          node qa-browser-responsive.js >> qa-quality24-proof.txt 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then FAIL=1; echo "FAIL: Responsive viewport matrix" >> qa-quality24-proof.txt; else echo "PASS: Responsive viewport matrix" >> qa-quality24-proof.txt; fi
          exit $FAIL
      - name: Publish auditable QA result
        if: always()
        run: |
          printf '\nSOURCE_QA=%s\nBROWSER_QA=%s\nSOURCE_COMMIT=%s\n' "${{ steps.source.outcome }}" "${{ steps.browser.outcome }}" "$GITHUB_SHA" >> qa-quality24-proof.txt
          if [ "${{ steps.source.outcome }}" = "success" ] && [ "${{ steps.browser.outcome }}" = "success" ]; then
            echo "FINAL: PASS" >> qa-quality24-proof.txt
            sed -i 's/app.js?v=safety23-final"/app.js?v=quality24-final"/; s/app.js?v=quality24"/app.js?v=quality24-final"/' index.html
          else
            echo "FINAL: FAIL" >> qa-quality24-proof.txt
          fi
          mv qa-quality24-proof.txt qa-production-proof.txt
          git config user.name "Friday Night IQ QA"
          git config user.email "actions@users.noreply.github.com"
          git add qa-production-proof.txt index.html
          git commit -m "Record production QA proof"
          git push origin HEAD:main
      - name: Fail if QA failed
        if: steps.source.outcome != 'success' || steps.browser.outcome != 'success'
        run: exit 1
