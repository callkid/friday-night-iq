name: Production QA proof

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  proof:
    if: github.event.head_commit.message == 'Trigger production QA proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run full production QA
        id: qa
        continue-on-error: true
        run: bash tools/run_gd3_qa.sh
      - name: Publish auditable QA result
        if: always()
        run: |
          mv qa-gd3-proof.txt qa-production-proof.txt
          printf '\nSOURCE_COMMIT=%s\n' "$GITHUB_SHA" >> qa-production-proof.txt
          git config user.name "Friday Night IQ QA"
          git config user.email "actions@users.noreply.github.com"
          git add qa-production-proof.txt
          git commit -m "Record production QA proof"
          git push origin HEAD:main
      - name: Fail if QA failed
        if: steps.qa.outcome != 'success'
        run: exit 1
