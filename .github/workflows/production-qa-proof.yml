name: Production QA proof

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  proof:
    if: github.event.head_commit.message == 'Trigger production QA proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run full Quality26 source QA
        id: source
        continue-on-error: true
        run: bash tools/run_safety18_qa.sh
      - name: Run repeated production browser QA
        id: browser
        continue-on-error: true
        run: |
          set +e
          echo "=== REAL BROWSER QUALITY26 QA ===" >> qa-quality26-proof.txt
          npm init -y >> qa-quality26-proof.txt 2>&1
          npm install playwright@1.55.0 >> qa-quality26-proof.txt 2>&1
          npx playwright install --with-deps chromium >> qa-quality26-proof.txt 2>&1
          python3 -m http.server 8000 --bind 127.0.0.1 >> /tmp/fniq-server.log 2>&1 &
          sleep 2
          FAIL=0
          run_three() {
            LABEL="$1"
            SCRIPT="$2"
            for i in 1 2 3; do
              echo "--- $LABEL pass $i ---" >> qa-quality26-proof.txt
              node "$SCRIPT" >> qa-quality26-proof.txt 2>&1
              CODE=$?
              if [ $CODE -ne 0 ]; then FAIL=1; echo "FAIL: $LABEL pass $i" >> qa-quality26-proof.txt; else echo "PASS: $LABEL pass $i" >> qa-quality26-proof.txt; fi
            done
          }
          run_three "Browser box" qa-browser-e2e.js
          run_three "Quality24 speed/confidence" qa-browser-quality24.js
          run_three "Quality26 football/correction" qa-browser-football-flow26-release.js
          run_three "Press-box tracker workflow" qa-browser-tracker-workflow.js
          run_three "Box ergonomics/readability" qa-browser-box-ergonomics.js
          run_three "Multi-team accent matrix" qa-browser-brand-colors.js
          echo "--- Pick-six browser path ---" >> qa-quality26-proof.txt
          node qa-browser-pick-six.js >> qa-quality26-proof.txt 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then FAIL=1; echo "FAIL: Pick-six browser path" >> qa-quality26-proof.txt; else echo "PASS: Pick-six browser path" >> qa-quality26-proof.txt; fi
          echo "--- Responsive viewport matrix ---" >> qa-quality26-proof.txt
          node qa-browser-responsive.js >> qa-quality26-proof.txt 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then FAIL=1; echo "FAIL: Responsive viewport matrix" >> qa-quality26-proof.txt; else echo "PASS: Responsive viewport matrix" >> qa-quality26-proof.txt; fi
          exit $FAIL
      - name: Publish auditable QA result
        if: always()
        run: |
          printf '\nSOURCE_QA=%s\nBROWSER_QA=%s\nSOURCE_COMMIT=%s\n' "${{ steps.source.outcome }}" "${{ steps.browser.outcome }}" "$GITHUB_SHA" >> qa-quality26-proof.txt
          if [ "${{ steps.source.outcome }}" = "success" ] && [ "${{ steps.browser.outcome }}" = "success" ]; then
            echo "FINAL: PASS" >> qa-quality26-proof.txt
            sed -i -E 's/app\.js\?v=[^"]+"/app.js?v=quality26-final"/' index.html
          else
            echo "FINAL: FAIL" >> qa-quality26-proof.txt
          fi
          mv qa-quality26-proof.txt qa-production-proof.txt
          git config user.name "Friday Night IQ QA"
          git config user.email "actions@users.noreply.github.com"
          git add qa-production-proof.txt index.html
          git commit -m "Record production QA proof"
          git push origin HEAD:main
      - name: Fail if QA failed
        if: steps.source.outcome != 'success' || steps.browser.outcome != 'success'
        run: exit 1

# Quality26 production proof trigger
