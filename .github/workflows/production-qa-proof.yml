name: Production QA proof

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  proof:
    if: github.event.head_commit.message == 'Trigger production QA proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run full Quality27 hotfix source QA
        id: source
        continue-on-error: true
        run: |
          bash tools/run_safety18_qa.sh
          node qa-quality27-hotfix.js
      - name: Run repeated production browser QA
        id: browser
        continue-on-error: true
        run: |
          set +e
          PROOF=qa-quality27-hotfix-proof.txt
          echo "=== REAL BROWSER QUALITY27 HOTFIX QA ===" >> "$PROOF"
          npm init -y >> "$PROOF" 2>&1
          npm install playwright@1.55.0 >> "$PROOF" 2>&1
          npx playwright install --with-deps chromium >> "$PROOF" 2>&1
          python3 -m http.server 8000 --bind 127.0.0.1 >> /tmp/fniq-server.log 2>&1 &
          sleep 2
          FAIL=0
          run_three() {
            LABEL="$1"
            SCRIPT="$2"
            for i in 1 2 3; do
              echo "--- $LABEL pass $i ---" >> "$PROOF"
              node "$SCRIPT" >> "$PROOF" 2>&1
              CODE=$?
              if [ $CODE -ne 0 ]; then FAIL=1; echo "FAIL: $LABEL pass $i" >> "$PROOF"; else echo "PASS: $LABEL pass $i" >> "$PROOF"; fi
            done
          }
          run_three "Browser box" qa-browser-e2e.js
          run_three "Quality24 speed/confidence" qa-browser-quality24.js
          run_three "Quality26 football/correction under Q27" qa-browser-football-flow26-release.js
          run_three "Quality27 tracker QoL" qa-browser-quality27.js
          run_three "Quality27 penalty/size hotfix" qa-browser-quality27-hotfix.js
          run_three "Press-box tracker workflow" qa-browser-tracker-workflow.js
          run_three "Box ergonomics/readability" qa-browser-box-ergonomics.js
          run_three "Multi-team accent matrix" qa-browser-brand-colors.js
          echo "--- Quality27 multi-device visual matrix ---" >> "$PROOF"
          node qa-browser-quality27-visual.js >> "$PROOF" 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then FAIL=1; echo "FAIL: Quality27 visual matrix" >> "$PROOF"; else echo "PASS: Quality27 visual matrix" >> "$PROOF"; fi
          echo "--- Pick-six browser path ---" >> "$PROOF"
          node qa-browser-pick-six.js >> "$PROOF" 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then FAIL=1; echo "FAIL: Pick-six browser path" >> "$PROOF"; else echo "PASS: Pick-six browser path" >> "$PROOF"; fi
          echo "--- Responsive viewport matrix ---" >> "$PROOF"
          node qa-browser-responsive.js >> "$PROOF" 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then FAIL=1; echo "FAIL: Responsive viewport matrix" >> "$PROOF"; else echo "PASS: Responsive viewport matrix" >> "$PROOF"; fi
          exit $FAIL
      - name: Publish auditable QA result
        if: always()
        run: |
          PROOF=qa-quality27-hotfix-proof.txt
          touch "$PROOF"
          printf '\nSOURCE_QA=%s\nBROWSER_QA=%s\nSOURCE_COMMIT=%s\n' "${{ steps.source.outcome }}" "${{ steps.browser.outcome }}" "$GITHUB_SHA" >> "$PROOF"
          if [ "${{ steps.source.outcome }}" = "success" ] && [ "${{ steps.browser.outcome }}" = "success" ]; then
            echo "FINAL: PASS" >> "$PROOF"
            # quality27 is a distinct allowed cache token from the previous production quality27-final URL.
            sed -i -E 's/app\.js\?v=[^"]+"/app.js?v=quality27"/' index.html
          else
            echo "FINAL: FAIL" >> "$PROOF"
          fi
          mv "$PROOF" qa-production-proof.txt
          git config user.name "Friday Night IQ QA"
          git config user.email "actions@users.noreply.github.com"
          git add qa-production-proof.txt index.html
          git commit -m "Record production QA proof"
          git push origin HEAD:main
      - name: Fail if QA failed
        if: steps.source.outcome != 'success' || steps.browser.outcome != 'success'
        run: exit 1

# Quality27 hotfix production proof trigger
