name: Safety18 final box QA

on:
  push:
    branches: [main]

jobs:
  full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run full safety18 regression suite
        run: bash tools/run_safety18_qa.sh

  browser-box:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start FNIQ server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/fniq-server.log 2>&1 &
          echo $! > /tmp/fniq-server.pid
          sleep 2
      - name: Box workflow E2E pass 1
        run: node qa-browser-e2e.js
      - name: Box workflow E2E pass 2
        run: node qa-browser-e2e.js
      - name: Box workflow E2E pass 3
        run: node qa-browser-e2e.js
